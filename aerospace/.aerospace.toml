config-version = 2

after-startup-command = [
  'exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0'
]

start-at-login = false

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 50

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
automatically-unhide-macos-hidden-apps = true

persistent-workspaces = ["1", "2", "3", "4", "5"]

[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
run = 'move-node-to-workspace 0'

[[on-window-detected]]
if.app-id = 'org.alacritty'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-name-regex-substring = 'telegram'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'finder'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'whatsapp'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'spotify'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'activity'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'discord'
run = 'layout floating'

[key-mapping]
    preset = 'qwerty'

[gaps]
    inner.horizontal = [{ monitor.main = 40 }, 10]
    #inner.vertical =   10
    outer.left =       [{ monitor."dell" = 400 }, 10]
    outer.right =      [{ monitor."dell" = 100 }, 10]
    outer.bottom =     [{ monitor."dell" = 100 }, 10]
    outer.top =        [{ monitor."dell" = 100 }, 10]

[mode.main.binding]
    # Window focus
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # Workspaces
    ctrl-1 = 'workspace 1'
    ctrl-2 = 'workspace 2'
    ctrl-3 = 'workspace 3'
    ctrl-4 = 'workspace 4'
    ctrl-5 = 'workspace 5'
    ctrl-6 = 'workspace 6'
    ctrl-7 = 'workspace 7'
    ctrl-8 = 'workspace 8'
    ctrl-9 = 'workspace 9'
    ctrl-0 = 'workspace 0'

    # alt-tab = 'workspace-back-and-forth'

    # hyper-w (alternatively, can use karabiner)
    alt-shift-cmd-ctrl-w = 'mode service'

[mode.service.binding]
    esc = 'mode main'
    enter = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    # backspace = ['close-all-windows-but-current', 'mode main']
    tab = ['move-workspace-to-monitor --wrap-around next', 'mode main']

    f = ['fullscreen', 'mode main']
    c = ['exec-and-forget open "rectangle://execute-action?name=center"', 'mode main']
    space = ['layout floating tiling', 'mode main']
    t = ['layout tiles horizontal vertical', 'mode main']
    a = ['layout accordion horizontal vertical', 'mode main']
    minus = ['resize smart -50', 'mode main']
    equal = ['resize smart +50', 'mode main']

    h = ['move left', 'mode main']
    j = ['move down', 'mode main']
    k = ['move up', 'mode main']
    l = ['move right', 'mode main']

    shift-h = ['join-with left', 'mode main']
    shift-j = ['join-with down', 'mode main']
    shift-k = ['join-with up', 'mode main']
    shift-l = ['join-with right', 'mode main']

    shift-1 = ['move-node-to-workspace 1', 'mode main']
    shift-2 = ['move-node-to-workspace 2', 'mode main']
    shift-3 = ['move-node-to-workspace 3', 'mode main']
    shift-4 = ['move-node-to-workspace 4', 'mode main']
    shift-5 = ['move-node-to-workspace 5', 'mode main']
    shift-6 = ['move-node-to-workspace 6', 'mode main']
    shift-7 = ['move-node-to-workspace 7', 'mode main']
    shift-8 = ['move-node-to-workspace 8', 'mode main']
    shift-9 = ['move-node-to-workspace 9', 'mode main']
    shift-0 = ['move-node-to-workspace 0', 'mode main']

