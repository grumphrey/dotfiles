unbind r
bind r source-file ~/.config/tmux/tmux.conf

# set prefix
unbind C-b
set-option -g prefix C-Space
bind C-Space send-prefix

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# tells tmux to support rgb color
set -as terminal-features ",*:RGB" 
set -ag terminal-overrides ",xterm-256color:RGB"

# count windows from 1
set -g base-index 1
set -g pane-base-index 1

# renumber windows when any close
set -g renumber-windows on

# remove delay from esc key 
set -s escape-time 0 

# scrolling and resize panes using mouse
set-option -g mouse on 

# thicker borders
set -g pane-border-lines heavy

# status bar, see tmux man page: STYLES
set -g status-style "fg=#a3b38c,bg=#1e222a"
set -g status-left "#[fg=#60728a,bg=#1e222a]#[fg=#1e222a,bg=#60728a] #{session_windows}#[fg=#60728a,bg=#1e222a]  "
set -g status-right "#[fg=colour8,bg=#1e222a] #S #[fg=#b48ead,bg=#1e222a] #[fg=#1e222a,bg=#b48ead]󱫋 #{session_attached}#[fg=#b48ead,bg=#1e222a]"
set -g window-status-format "#[fg=black,bold bg=default]│ #[fg=black,bold bg=default]#I #[fg=white bg=#1e222a]#W #[fg=black,bold bg=default]│"
set -g window-status-current-format "#[fg=black,bold bg=default]│ #[fg=#e7c173,bold bg=default]#I #[fg=#ebcb8b bg=#1e222a]#W #[fg=black,bold bg=default]│"
set -g status-left-length 100
set -g status-position top
set -g status-justify left

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# open panes in cwd
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
